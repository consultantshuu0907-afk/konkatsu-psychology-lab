title: 婚活心理ラボ
description: "行動心理学でわかる、後悔しない婚活サービスの選び方"
url: "https://consultantshuu0907-afk.github.io" # GitHub Pagesの標準URL（独自ドメイン設定後はそちらに変更）
baseurl: "/konkatsu-psychology-lab" # リポジトリ名に合わせたパス（プロジェクトページのため必須）
lang: ja

# ビルド設定（GitHub Pagesが自動でJekyllビルドするため特別な設定は不要）
markdown: kramdown
permalink: /:categories/:title/
paginate: 10
paginate_path: "/page:num/"

# GitHub Pages標準の安全なプラグインのみ使用（Gemfile不要・追加設定不要で動作）
plugins:
  - jekyll-seo-tag    # canonical URL・OGP・Twitter Card・構造化データ(JSON-LD)を自動出力
  - jekyll-sitemap    # /sitemap.xml を自動生成
  - jekyll-feed       # /feed.xml (RSS) を自動生成

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      image: /assets/img/ogp.png

# サイト運営者情報（フッター・運営者情報ページ用）
author: 辻秀作（UP TENPO）
pr_notice: "当サイトのコンテンツには広告（プロモーション）を含みます。掲載している情報は、実際の商品・サービスとは異なる場合があります。ご利用の際は必ず公式サイトで最新情報をご確認ください。"

# SEOタグ用の追加設定
logo: /assets/img/ogp.png
twitter:
  card: summary_large_image
social:
  name: 婚活心理ラボ

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
