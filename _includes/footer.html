{% unless page.url == '/shindan/' %}
<div class="floating-shindan" id="floating-shindan" hidden>
  <a class="floating-shindan-link" href="{{ '/shindan/' | relative_url }}">
    <span class="fs-eyebrow">無料 ・ 約30秒</span>
    <strong>あなたに合う婚活タイプを診断する →</strong>
  </a>
  <button type="button" class="floating-shindan-close" aria-label="診断バナーを閉じる">×</button>
</div>
{% endunless %}
<footer class="site-footer">
  <div class="wrap">
    <a class="footer-shindan-cta" href="{{ '/shindan/' | relative_url }}">
      <span>あなたに合う婚活サービスは？</span><strong>無料タイプ診断はこちら →</strong>
    </a>
    <p class="pr-footer-notice">{{ site.pr_notice }}</p>
    <nav class="footer-nav" aria-label="フッターナビゲーション">
      <a href="{{ '/about/' | relative_url }}">運営者情報</a>
      <a href="{{ '/privacy/' | relative_url }}">プライバシーポリシー</a>
      <a href="{{ '/contact/' | relative_url }}">お問い合わせ</a>
    </nav>
    <p class="copyright">&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
  </div>
</footer>
