<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ja' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | {{ site.description }}{% endif %}</title>
<meta name="theme-color" content="#a85763">
{% seo title=false %}
{% feed_meta %}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23c97b84'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'%3E婚%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{{ page.body_class }}">
<a class="skip-link" href="#main-content">本文へスキップ</a>
{% include header.html %}
<main class="site-main{% if page.main_class %} {{ page.main_class }}{% endif %}" id="main-content">
{{ content }}
</main>
{% include footer.html %}
<button class="back-to-top" aria-label="ページ上部へ戻る">↑</button>
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
